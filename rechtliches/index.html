<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Impressum und Datenschutz – Adrian Tajik</title>
    <meta name="description" content="Impressum und Datenschutzerklärung der Website von Adrian Tajik." />
    <link rel="canonical" href="https://www.adriantajik.dev/rechtliches/" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Gleiches Design wie die Startseite, vor dem ersten Zeichnen gesetzt -->
    <script>
      try {
        var saved = localStorage.getItem('portfolio-theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <link rel="preload" href="%BASE_URL%fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/legal-main.tsx"></script>
  </body>
</html>
