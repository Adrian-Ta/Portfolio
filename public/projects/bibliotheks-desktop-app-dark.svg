<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Bibliotheks-App: Java-Desktopanwendung mit Bestand und Ausleihe, Dateien in AWS S3</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#262c35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .app { fill: #0e1116; stroke: #5eead4; stroke-width: 1.5; }
      .part { fill: #12302d; stroke: #5eead4; stroke-width: 1.2; }
      .store { fill: #0e1116; stroke: #5eead4; stroke-width: 1.5; }
      .title { font-size: 20px; font-weight: 700; fill: #eceef1; }
      .item { font-size: 18px; font-weight: 600; fill: #eceef1; }
      .sub { font-size: 16px; fill: #b4bac4; }
      .label { font-size: 16px; font-weight: 600; fill: #5eead4; }
      .flow { stroke: #5eead4; stroke-width: 1.8; fill: none; }
      .caption { font-size: 15px; fill: #8b93a0; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#151a21"/>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Desktopanwendung -->
  <rect class="app" x="60" y="90" width="460" height="340" rx="12"/>
  <text class="title" x="88" y="132">Java-Desktopanwendung</text>
  <text class="sub" x="88" y="156">Oberfläche für das Bibliothekspersonal</text>

  <rect class="part" x="88" y="186" width="404" height="96" rx="10"/>
  <text class="item" x="112" y="226">Bestand verwalten</text>
  <text class="sub" x="112" y="252">Medien anlegen, suchen, bearbeiten</text>

  <rect class="part" x="88" y="302" width="404" height="96" rx="10"/>
  <text class="item" x="112" y="342">Ausleihe</text>
  <text class="sub" x="112" y="368">Ausleihen und Rückgaben erfassen</text>

  <!-- Verbindung -->
  <path class="flow" d="M522 230 H678" marker-end="url(#arrow)"/>
  <path class="flow" d="M678 290 H524" marker-end="url(#arrow)"/>
  <text class="label" x="600" y="218" text-anchor="middle">speichern</text>
  <text class="label" x="600" y="314" text-anchor="middle">laden</text>

  <!-- AWS S3 -->
  <rect class="store" x="680" y="180" width="220" height="160" rx="12"/>
  <text class="title" x="790" y="248" text-anchor="middle">AWS S3</text>
  <text class="sub" x="790" y="274" text-anchor="middle">Dateien in der Cloud</text>

  <text class="caption" x="60" y="490">Schema der Anwendung (Teamprojekt im Fachabitur)</text>
</svg>
