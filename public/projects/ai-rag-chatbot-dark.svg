<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Konzept-Skizze RAG-Chatbot: Chatfenster mit Frage und Antwort, daneben Dokumente, Wissenssuche, Sprachmodell</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#262c35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .panel { fill: #0e1116; stroke: #353d49; stroke-width: 1; }
      .bubble-user { fill: #12302d; }
      .bubble-bot { fill: #151a21; stroke: #353d49; stroke-width: 1; }
      .ph { fill: #262c35; }
      .ph-accent { fill: #5eead4; opacity: .35; }
      .box { fill: #0e1116; stroke: #5eead4; stroke-width: 1.5; }
      .core { fill: #12302d; stroke: #5eead4; stroke-width: 1.5; }
      .title { font-size: 18px; font-weight: 700; fill: #eceef1; }
      .sub { font-size: 15px; fill: #b4bac4; }
      .label { font-size: 14px; font-weight: 600; fill: #5eead4; }
      .flow { stroke: #5eead4; stroke-width: 1.8; fill: none; }
      .caption { font-size: 15px; fill: #8b93a0; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#151a21"/>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Chatfenster: Inhalte nur als Platzhalter -->
  <rect class="panel" x="40" y="60" width="420" height="390" rx="12"/>
  <line x1="40" y1="106" x2="460" y2="106" stroke="#353d49" stroke-width="1"/>
  <circle cx="66" cy="83" r="7" fill="#5eead4"/>
  <text class="title" x="84" y="89">Assistent</text>

  <rect class="bubble-user" x="196" y="128" width="240" height="58" rx="14"/>
  <rect class="ph-accent" x="214" y="144" width="190" height="10" rx="5"/>
  <rect class="ph-accent" x="214" y="162" width="120" height="10" rx="5"/>

  <rect class="bubble-bot" x="64" y="204" width="300" height="128" rx="14"/>
  <rect class="ph" x="82" y="222" width="250" height="10" rx="5"/>
  <rect class="ph" x="82" y="240" width="226" height="10" rx="5"/>
  <rect class="ph" x="82" y="258" width="238" height="10" rx="5"/>
  <rect class="ph" x="82" y="276" width="150" height="10" rx="5"/>
  <rect fill="none" stroke="#5eead4" stroke-width="1" x="82" y="298" width="82" height="22" rx="11"/>
  <text class="label" x="123" y="314" text-anchor="middle">Quelle</text>

  <rect fill="none" stroke="#353d49" stroke-width="1" x="64" y="388" width="372" height="40" rx="20"/>
  <text class="sub" x="86" y="413">Frage stellen …</text>

  <!-- Ablauf RAG -->
  <rect class="box" x="580" y="60" width="300" height="82" rx="10"/>
  <text class="title" x="730" y="96" text-anchor="middle">Dokumente</text>
  <text class="sub" x="730" y="120" text-anchor="middle">bereitgestellte Wissensquellen</text>
  <path class="flow" d="M730 142 V186" marker-end="url(#arrow)"/>

  <rect class="box" x="580" y="188" width="300" height="82" rx="10"/>
  <text class="title" x="730" y="224" text-anchor="middle">Wissenssuche</text>
  <text class="sub" x="730" y="248" text-anchor="middle">passende Abschnitte finden</text>
  <path class="flow" d="M730 270 V314" marker-end="url(#arrow)"/>

  <rect class="core" x="580" y="316" width="300" height="82" rx="10"/>
  <text class="title" x="730" y="352" text-anchor="middle">Sprachmodell</text>
  <text class="sub" x="730" y="376" text-anchor="middle">formuliert die Antwort</text>

  <!-- Frage hin, Antwort zurück -->
  <path class="flow" d="M460 229 H578" marker-end="url(#arrow)"/>
  <text class="label" x="519" y="219" text-anchor="middle">Frage</text>
  <path class="flow" d="M580 357 H462" marker-end="url(#arrow)"/>
  <text class="label" x="521" y="347" text-anchor="middle">Antwort</text>

  <text class="caption" x="40" y="500">Konzept-Skizze: Antworten auf Basis bereitgestellter Wissensquellen (RAG)</text>
</svg>
