<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Odoo: Beschaffung und Absatz über die Module Einkauf, Verkauf, Lager und Rechnungswesen</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#262c35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lane { font-size: 17px; font-weight: 700; fill: #b4bac4; letter-spacing: .2px; }
      .row { font-size: 16px; font-weight: 600; fill: #5eead4; }
      .box { fill: #0e1116; stroke: #5eead4; stroke-width: 1.5; }
      .title { font-size: 20px; font-weight: 700; fill: #eceef1; }
      .sub { font-size: 16px; fill: #b4bac4; }
      .flow { stroke: #5eead4; stroke-width: 1.8; fill: none; }
      .divider { stroke: #353d49; stroke-width: 1; stroke-dasharray: 4 5; }
      .caption { font-size: 15px; fill: #8b93a0; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#151a21"/>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Spalten = Module -->
  <text class="lane" x="180" y="64" text-anchor="middle">Einkauf / Verkauf</text>
  <text class="lane" x="480" y="64" text-anchor="middle">Lager</text>
  <text class="lane" x="780" y="64" text-anchor="middle">Rechnungswesen</text>
  <line class="divider" x1="330" y1="40" x2="330" y2="470"/>
  <line class="divider" x1="630" y1="40" x2="630" y2="470"/>

  <!-- Beschaffung -->
  <text class="row" x="70" y="140">Beschaffung</text>
  <rect class="box" x="70" y="156" width="220" height="84" rx="10"/>
  <text class="title" x="180" y="192" text-anchor="middle">Bestellung</text>
  <text class="sub" x="180" y="216" text-anchor="middle">beim Lieferanten</text>
  <path class="flow" d="M290 198 H368" marker-end="url(#arrow)"/>
  <rect class="box" x="370" y="156" width="220" height="84" rx="10"/>
  <text class="title" x="480" y="192" text-anchor="middle">Wareneingang</text>
  <text class="sub" x="480" y="216" text-anchor="middle">Bestand steigt</text>
  <path class="flow" d="M590 198 H668" marker-end="url(#arrow)"/>
  <rect class="box" x="670" y="156" width="220" height="84" rx="10"/>
  <text class="title" x="780" y="192" text-anchor="middle">Eingangsrechnung</text>
  <text class="sub" x="780" y="216" text-anchor="middle">wird gebucht</text>

  <!-- Absatz -->
  <text class="row" x="70" y="320">Absatz</text>
  <rect class="box" x="70" y="336" width="220" height="84" rx="10"/>
  <text class="title" x="180" y="372" text-anchor="middle">Kundenauftrag</text>
  <text class="sub" x="180" y="396" text-anchor="middle">aus dem Angebot</text>
  <path class="flow" d="M290 378 H368" marker-end="url(#arrow)"/>
  <rect class="box" x="370" y="336" width="220" height="84" rx="10"/>
  <text class="title" x="480" y="372" text-anchor="middle">Lieferung</text>
  <text class="sub" x="480" y="396" text-anchor="middle">Bestand sinkt</text>
  <path class="flow" d="M590 378 H668" marker-end="url(#arrow)"/>
  <rect class="box" x="670" y="336" width="220" height="84" rx="10"/>
  <text class="title" x="780" y="372" text-anchor="middle">Ausgangsrechnung</text>
  <text class="sub" x="780" y="396" text-anchor="middle">wird gebucht</text>

  <text class="caption" x="70" y="508">Grundabläufe in Odoo: Beschaffung (Procure-to-Pay) und Absatz (Order-to-Cash)</text>
</svg>
