<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Konzept-Skizze BPMN-Prozess: Start, Anfrage prüfen, Entscheidung per DMN-Regel, Verzweigung zu Freigeben oder Rückfrage, Ende</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#262c35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lane { fill: #0e1116; stroke: #353d49; stroke-width: 1; }
      .lane-label { font-size: 15px; font-weight: 700; fill: #b4bac4; }
      .box { fill: #0e1116; stroke: #5eead4; stroke-width: 1.5; }
      .core { fill: #12302d; stroke: #5eead4; stroke-width: 1.5; }
      .event { fill: #0e1116; stroke: #5eead4; stroke-width: 1.8; }
      .event-end { fill: #0e1116; stroke: #5eead4; stroke-width: 4; }
      .icon { fill: none; stroke: #5eead4; stroke-width: 1.2; }
      .title { font-size: 17px; font-weight: 700; fill: #eceef1; }
      .sub { font-size: 14px; fill: #b4bac4; }
      .label { font-size: 14px; font-weight: 600; fill: #5eead4; }
      .flow { stroke: #5eead4; stroke-width: 1.8; fill: none; }
      .caption { font-size: 15px; fill: #8b93a0; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#151a21"/>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Pool mit einer Bahn -->
  <rect class="lane" x="40" y="96" width="880" height="320" rx="10"/>
  <line x1="74" y1="96" x2="74" y2="416" stroke="#353d49" stroke-width="1"/>
  <text class="lane-label" x="57" y="256" text-anchor="middle" transform="rotate(-90 57 256)">Geschäftsprozess</text>

  <!-- Start -->
  <circle class="event" cx="114" cy="256" r="20"/>
  <text class="sub" x="114" y="302" text-anchor="middle">Anfrage</text>
  <path class="flow" d="M134 256 H168" marker-end="url(#arrow)"/>

  <!-- Aufgabe -->
  <rect class="box" x="170" y="216" width="150" height="80" rx="10"/>
  <text class="title" x="245" y="252" text-anchor="middle">Anfrage</text>
  <text class="title" x="245" y="274" text-anchor="middle">prüfen</text>
  <path class="flow" d="M320 256 H358" marker-end="url(#arrow)"/>

  <!-- Geschäftsregel (DMN) -->
  <rect class="core" x="360" y="216" width="160" height="80" rx="10"/>
  <rect class="icon" x="372" y="226" width="18" height="13" rx="1"/>
  <line class="icon" x1="372" y1="231" x2="390" y2="231"/>
  <line class="icon" x1="378" y1="231" x2="378" y2="239"/>
  <text class="title" x="440" y="256" text-anchor="middle">Regel anwenden</text>
  <text class="sub" x="440" y="278" text-anchor="middle">DMN-Tabelle</text>
  <path class="flow" d="M520 256 H548" marker-end="url(#arrow)"/>

  <!-- Exklusives Gateway -->
  <path class="box" d="M580 226 L610 256 L580 286 L550 256 Z"/>
  <path class="icon" d="M571 247 L589 265 M589 247 L571 265" stroke-width="2"/>

  <path class="flow" d="M580 226 V162 H648" marker-end="url(#arrow)"/>
  <text class="label" x="568" y="200" text-anchor="end">erfüllt</text>
  <path class="flow" d="M580 286 V350 H648" marker-end="url(#arrow)"/>
  <text class="label" x="568" y="324" text-anchor="end">nicht erfüllt</text>

  <rect class="box" x="650" y="124" width="150" height="76" rx="10"/>
  <text class="title" x="725" y="168" text-anchor="middle">Freigeben</text>
  <path class="flow" d="M800 162 H860 V234" marker-end="url(#arrow)"/>

  <rect class="box" x="650" y="312" width="150" height="76" rx="10"/>
  <text class="title" x="725" y="356" text-anchor="middle">Rückfrage</text>
  <path class="flow" d="M800 350 H860 V278" marker-end="url(#arrow)"/>

  <!-- Ende -->
  <circle class="event-end" cx="860" cy="256" r="20"/>

  <text class="caption" x="40" y="476">Konzept-Skizze: Prozess in BPMN, Entscheidung über eine DMN-Regel</text>
</svg>
